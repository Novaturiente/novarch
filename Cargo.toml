[package]
name = "novarch"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Declarative package management for Arch Linux"
repository = "https://github.com/Novaturiente/novarch"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
libc = "0.2"
# with-dirs: expand ~ during tab completion. History and custom bindings are unused.
rustyline = { version = "19", default-features = false, features = ["with-dirs"] }
serde_json = "1"
toml_edit = "0.25"
