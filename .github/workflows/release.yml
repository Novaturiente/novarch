name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git rust github-cli

      - uses: actions/checkout@v4

      - name: Tag must match the Cargo.toml version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"

      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Package (makepkg refuses root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && packaging/build-pkg.sh"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "novarch $GITHUB_REF_NAME" \
            --generate-notes
